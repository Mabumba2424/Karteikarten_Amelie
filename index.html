<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kartei</title>
<style>
/* ===== Design-Tokens ===== */
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --bg:#EEF4FF; --surface:#FFFFFF; --ink:#1F2547; --muted:#5B6690; --line:#D9E3F8;
  --accent:#5468FF; --accent-soft:#E6EAFF; --on-accent:#FFFFFF;
  --paper:#FFFEFA; --rule:#D8E8FF; --margin:#FF8A9A;
  --ok:#4FD69B; --ok-ink:#0C6A42; --ok-bg:#D9F7E8;
  --mid:#FFC93C; --mid-ink:#7A4E00; --mid-bg:#FFF0C2;
  --bad:#FF7B7B; --bad-ink:#A62626; --bad-bg:#FFE1E1;
  --danger:#D63C42; --none-bg:#E3EAF8; --none-ink:#43506C;
  --lh:30px;
  --round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:8px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1{font:750 30px/1.15 var(--round);letter-spacing:-.02em;margin:6px 0 14px;overflow-wrap:anywhere}
h1:focus{outline:none}
h2{font:650 17px/1.3 var(--round);margin:26px 0 10px}
.brand{display:flex;align-items:center;gap:10px}
.lead{margin:-8px 0 12px;color:var(--muted)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ===== Buttons ===== */
.btn{min-height:48px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.ghost{background:transparent}
.btn.small{min-height:40px;padding:0 14px;font-size:15px}
.btn.wide{width:100%;min-height:54px;font-size:17px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.icon-btn{width:44px;height:44px;flex:none;border-radius:12px;border:1px solid transparent;background:transparent;display:inline-grid;place-items:center;color:var(--muted)}
.icon-btn.accent{background:var(--accent);color:var(--on-accent)}
.icon-btn.outline{border-color:var(--line);background:var(--surface);color:var(--ink)}
.icon-btn:disabled{opacity:.35}
@media (hover:hover){
  .icon-btn.danger:hover{color:var(--bad-ink);background:var(--bad-bg)}
  .icon-btn:not(.accent):not(.danger):not(:disabled):hover{background:var(--none-bg)}
  .btn:not(.primary):not(.danger):not(:disabled):hover{border-color:var(--accent)}
}
.top-row{display:flex;align-items:center;justify-content:space-between;min-height:44px;gap:8px}
.actions{display:flex;gap:6px;align-items:center}
.backbtn{display:inline-flex;align-items:center;gap:2px;height:44px;padding:0 10px 0 0;border:0;background:none;color:var(--accent);font-weight:600}
.count{color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}

/* ===== Listen: Ordner & Karten ===== */
.tiles,.clist,.rlist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.tile{display:flex;align-items:stretch;background:hsl(var(--h) 100% 96%);border:1.5px solid hsl(var(--h) 75% 86%);border-radius:18px}
.tile-main{flex:1;min-width:0;text-align:left;background:none;border:0;padding:12px 6px 12px 12px;display:flex;gap:14px;align-items:center;border-radius:18px}
.tile-av{width:48px;height:48px;flex:none;border-radius:14px;display:grid;place-items:center;font:700 22px var(--round);background:hsl(var(--h) 90% 82%);color:hsl(var(--h) 60% 24%)}
.tile-body{display:grid;gap:4px;min-width:0;flex:1}
.tile>.icon-btn{align-self:center;margin-right:6px}
.tile-name{font:700 19px/1.25 var(--round);overflow-wrap:anywhere}
.tile-meta{color:var(--muted);font-size:14px}
.bar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--none-bg);margin-top:6px}
.bar i{display:block;height:100%}
.bar .b-ok{background:var(--ok)}.bar .b-mid{background:var(--mid)}.bar .b-bad{background:var(--bad)}
.crow{display:flex;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.crow-main{flex:1;min-width:0;display:flex;gap:12px;align-items:flex-start;text-align:left;background:none;border:0;padding:12px 6px 12px 14px;border-radius:14px}
.crow>.icon-btn{align-self:center;margin-right:6px}
.crow-text{display:grid;gap:2px;min-width:0}
.crow-q{font-weight:600;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.crow-a{color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:12px;height:12px;border-radius:50%;flex:none;margin-top:6px;background:var(--none-bg);border:2px solid var(--muted)}
.dot.s-richtig{background:var(--ok);border-color:var(--ok)}
.dot.s-mittel{background:var(--mid);border-color:var(--mid)}
.dot.s-falsch{background:var(--bad);border-color:var(--bad)}
.empty-state{padding:28px 18px;border:2px dashed #B9C6FF;border-radius:18px;text-align:center;color:var(--muted);background:rgba(255,255,255,.6)}
.empty-state p{margin:0 0 14px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:600;background:var(--none-bg);color:var(--none-ink)}
.badge::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.badge.s-richtig{background:var(--ok-bg);color:var(--ok-ink)}
.badge.s-mittel{background:var(--mid-bg);color:var(--mid-ink)}
.badge.s-falsch{background:var(--bad-bg);color:var(--bad-ink)}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.row-actions{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.banner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;margin:0 0 16px;border-radius:14px;background:var(--surface);border:1px solid var(--accent)}
.banner p{margin:0;flex:1 1 200px;overflow-wrap:anywhere}
.banner-actions{display:flex;gap:8px}

/* ===== Formularelemente ===== */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.seg.stack{grid-template-columns:1fr}
.seg button{min-height:52px;padding:8px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);text-align:left;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
.seg button small{color:var(--muted);font-weight:500;font-size:14px}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.seg button:disabled{opacity:.4}
.count-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.count-val{text-align:center;font-variant-numeric:tabular-nums}
.count-val output{display:block;font:750 44px/1 var(--round);letter-spacing:-.02em}
.count-val span{color:var(--muted);font-size:14px}
input[type=range]{width:100%;height:32px;accent-color:var(--accent);margin:4px 0 10px}
.switch-row{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:48px}
.switch-row small{display:block;color:var(--muted)}
input[type=checkbox][role=switch]{-webkit-appearance:none;appearance:none;width:52px;height:32px;border-radius:16px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:background .2s;margin:0}
input[type=checkbox][role=switch]::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.35)}
input[type=checkbox][role=switch]:checked{background:var(--accent)}
input[type=checkbox][role=switch]:checked::after{transform:translateX(20px)}
.hint{color:var(--muted);font-size:14px;margin:10px 0 0;text-align:center;min-height:1.4em}
.kbd-hint{display:none;color:var(--muted);font-size:13px;margin:6px 0 0;text-align:center}
@media (hover:hover) and (pointer:fine){.kbd-hint{display:block}}

/* ===== Prüfung: Karteikarte ===== */
.prog{height:6px;border-radius:3px;background:var(--none-bg);overflow:hidden;margin:6px 0 4px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:3px}
.flip{perspective:1600px;margin-top:16px}
.flip-inner{display:grid;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,.7,.2,1)}
.is-flipped .flip-inner{transform:rotateY(180deg)}
.face{grid-area:1/1;-webkit-backface-visibility:hidden;backface-visibility:hidden;background:var(--paper);border-radius:8px;box-shadow:0 1px 1px rgba(0,0,0,.12),0 16px 32px -16px rgba(20,30,70,.5);display:flex;flex-direction:column;min-width:0}
.face.back{transform:rotateY(180deg)}
.face[inert]{pointer-events:none}
.face-head{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 20px;background:hsl(var(--h,225) 100% 95%);border-radius:8px 8px 0 0;border-bottom:2px solid var(--margin);font-weight:600;font-size:14px;color:var(--muted)}
.face-head span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.face-body{flex:1;padding:0 20px;min-height:calc(var(--lh)*9);border-radius:0 0 8px 8px;font:17px/var(--lh) ui-serif,"New York","Iowan Old Style",Georgia,serif;background:linear-gradient(to bottom,transparent calc(var(--lh) - 1px),var(--rule) calc(var(--lh) - 1px)) 0 0/100% var(--lh) repeat-y}
.face-body p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.face-body:focus-within{box-shadow:inset 3px 0 0 var(--accent)}
.q{font-weight:600;margin-bottom:var(--lh)!important}
.face-body textarea{display:block;width:100%;padding:0;margin:0;border:0;outline:0;background:transparent;resize:none;overflow:hidden;font:inherit;min-height:calc(var(--lh)*4)}
.face-body textarea::placeholder{color:var(--muted);opacity:.8}
.cmp{display:grid;grid-template-columns:1fr 1fr;column-gap:22px}
.cmp h3{margin:0;font:600 14px/var(--lh) -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;color:var(--muted)}
.cmp p.empty{color:var(--muted);font-style:italic}
@media (max-width:519px){.cmp{grid-template-columns:1fr}.cmp>div+div{margin-top:var(--lh)}}
.rate-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.rate-btn{min-height:58px;border-radius:16px;border:0;font:700 17px var(--round)}
.rate-btn.s-richtig{background:var(--ok);color:#06331F}
.rate-btn.s-mittel{background:var(--mid);color:#3A2600}
.rate-btn.s-falsch{background:var(--bad);color:#4A0A0A}
.rate-btn:disabled{opacity:.3;cursor:not-allowed}

/* ===== Ergebnis ===== */
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:6px}
.stat{border-radius:14px;padding:12px 8px;text-align:center;font-weight:600}
.stat b{display:block;font:750 32px/1.1 var(--round);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat.s-richtig{background:var(--ok-bg);color:var(--ok-ink)}
.stat.s-mittel{background:var(--mid-bg);color:var(--mid-ink)}
.stat.s-falsch{background:var(--bad-bg);color:var(--bad-ink)}
.ri{background:var(--surface);border:1px solid var(--line);border-left-width:6px;border-radius:14px;padding:14px 16px}
.ri.s-richtig{border-left-color:var(--ok)}.ri.s-mittel{border-left-color:var(--mid)}.ri.s-falsch{border-left-color:var(--bad)}
.ri-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;color:var(--muted);font-size:14px}
.ri-q{margin:0 0 10px;font-weight:650;white-space:pre-wrap;overflow-wrap:anywhere}
.ri .cmp{gap:10px 22px}
.ri .cmp h3{font:600 13px/1.4 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:var(--muted);margin-bottom:2px}
.ri .cmp p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.ri .cmp>div+div{margin-top:0}
@media (max-width:519px){.ri .cmp>div+div{margin-top:4px}}
.retest{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:10px}

/* ===== Dialoge & Toast ===== */
.overlay{position:fixed;top:0;bottom:0;left:0;right:0;z-index:50;display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;background:rgba(60,75,150,.32);padding:calc(env(safe-area-inset-top,0px) + 5vh) 12px calc(env(safe-area-inset-bottom,0px) + 16px)}
.sheet{width:100%;max-width:520px;background:var(--surface);border-radius:20px;padding:16px 18px 18px;box-shadow:0 20px 50px -10px rgba(40,50,110,.35)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sheet h2{margin:0;font-size:20px}
.sheet p{margin:0 0 14px}
.field{display:grid;gap:6px;margin:0 0 14px;font-weight:600;font-size:15px}
.field input,.field textarea,.sheet textarea{width:100%;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-size:17px;font-weight:400;resize:vertical}
.sheet hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.sheet-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end}
.sheet .label{font-weight:600;font-size:15px;margin:0 0 6px}
.err{color:var(--bad-ink);min-height:1.4em;margin:0 0 8px!important;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:15px;max-width:calc(100% - 32px);text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){
  .flip-inner,.toast,input[type=checkbox][role=switch],input[type=checkbox][role=switch]::after{transition:none}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<noscript>Diese App braucht JavaScript.</noscript>
<script>
(function(){
'use strict';

/* =====================================================================
   1. KONSTANTEN
   ===================================================================== */
var KEY = 'kartei-app-v1';
var LH = 30;
var STATUS = {richtig:'Richtig', mittel:'Mittel', falsch:'Falsch'};
var TYPES  = {de:'Nur Deutsch', deen:'Deutsch – Englisch'};
var DIRS   = {mixed:'Gemischt', 'de-en':'Deutsch → Englisch', 'en-de':'Englisch → Deutsch'};
var DIR_SHORT = {'de-en':'DE → EN', 'en-de':'EN → DE'};

var svg = function(d,w,sw){return '<svg viewBox="0 0 24 24" width="'+(w||22)+'" height="'+(w||22)+'" fill="none" stroke="currentColor" stroke-width="'+(sw||2.2)+'" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="'+d+'"/></svg>';};
var ICON = {
  plus:   svg('M12 5v14M5 12h14'),
  minus:  svg('M5 12h14'),
  trash:  svg('M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v5M14 11v5',21,1.9),
  back:   svg('M15 5l-7 7 7 7',24,2.4),
  x:      svg('M6 6l12 12M18 6L6 18'),
  backup: svg('M12 4v11M8 11l4 4 4-4M5 20h14',22,1.9)
};

/* =====================================================================
   2. HILFSFUNKTIONEN
   ===================================================================== */
var $  = function(s,r){return (r||document).querySelector(s);};
var $$ = function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};
var esc = function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
var uid = function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);};
var plural = function(n,one,many){return n+' '+(n===1?one:many);};

var toastTimer = null;
function toast(msg){
  var t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){t.classList.remove('show');}, 2400);
}

/* =====================================================================
   3. STORE: Daten laden und speichern
   ===================================================================== */
var state, saveTimer = null, storageWarned = false;

var Store = {
  normalize: function(s){
    s = s || {};
    s.folders = (Array.isArray(s.folders) ? s.folders : []).filter(function(f){return f && typeof f.name === 'string';}).map(function(f){
      return {
        id: f.id || uid(),
        name: f.name,
        type: f.type === 'deen' ? 'deen' : 'de',   // ältere Ordner ohne Typ gelten als „Nur Deutsch“
        cards: (Array.isArray(f.cards) ? f.cards : []).filter(function(c){return c && typeof c.q === 'string';}).map(function(c){
          return {id:c.id||uid(), q:c.q, a:String(c.a==null?'':c.a), s:(c.s==='richtig'||c.s==='mittel'||c.s==='falsch')?c.s:null};
        })
      };
    });
    s.session = (s.session && Array.isArray(s.session.ids) && s.session.res) ? s.session : null;
    if(s.session && !s.session.dirs) s.session.dirs = {};
    var p = s.prefs || {};
    s.prefs = {
      pool: p.pool || 'all',
      count: +p.count > 0 ? +p.count : 10,
      shuffle: p.shuffle !== false,
      dir: DIRS[p.dir] ? p.dir : 'mixed'
    };
    return s;
  },
  load: function(){
    try{ var raw = localStorage.getItem(KEY); if(raw) return Store.normalize(JSON.parse(raw)); }catch(e){}
    return Store.normalize({});
  },
  save: function(){
    clearTimeout(saveTimer); saveTimer = null;
    try{ localStorage.setItem(KEY, JSON.stringify(state)); }
    catch(e){ if(!storageWarned){storageWarned = true; toast('Speichern im Browser nicht möglich. Deine Karten bleiben nur bis zum Schließen erhalten.');} }
  },
  saveSoon: function(){ clearTimeout(saveTimer); saveTimer = setTimeout(Store.save, 300); }
};
state = Store.load();
window.addEventListener('pagehide', function(){ if(saveTimer) Store.save(); });
document.addEventListener('visibilitychange', function(){ if(document.hidden && saveTimer) Store.save(); });

/* =====================================================================
   4. MODEL: Logik ohne Oberfläche
   ===================================================================== */
var Model = {
  folder: function(id){ return state.folders.find(function(f){return f.id===id;}); },
  isDeen: function(f){ return !!f && f.type === 'deen'; },
  shuffled: function(a){
    var r = a.slice();
    for(var i=r.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), t=r[i]; r[i]=r[j]; r[j]=t; }
    return r;
  },
  initial: function(n){ return (Array.from(n.trim())[0]||'?').toUpperCase(); },
  hue: function(name){ var h=0; for(var i=0;i<name.length;i++) h=(h*31+name.charCodeAt(i))%360; return h; },
  counts: function(cards){
    var c = {richtig:0, mittel:0, falsch:0, neu:0};
    cards.forEach(function(x){ c[x.s||'neu']++; });
    return c;
  },
  pool: function(f,p){
    var c = f.cards;
    if(p==='schwach') return c.filter(function(x){return x.s==='mittel'||x.s==='falsch';});
    if(p==='falsch')  return c.filter(function(x){return x.s==='falsch';});
    if(p==='neu')     return c.filter(function(x){return !x.s;});
    return c;
  },
  effCount: function(max){ return max<1 ? 0 : Math.max(1, Math.min(state.prefs.count, max)); },
  /* Frage/Antwort je nach Richtung: Karten speichern immer q = Deutsch, a = Englisch */
  side: function(card,dir){ return dir==='en-de' ? {q:card.a, a:card.q} : {q:card.q, a:card.a}; },
  /* Richtung je Karte festlegen (nur Deutsch-Englisch-Ordner kennen „en-de“) */
  pickDirs: function(f,ids,mode){
    var d = {};
    ids.forEach(function(id){
      d[id] = !Model.isDeen(f) ? 'de-en' : (mode==='mixed' ? (Math.random()<0.5?'de-en':'en-de') : mode);
    });
    return d;
  },
  sanitizeSession: function(){
    var s = state.session; if(!s) return;
    var f = Model.folder(s.folderId);
    if(!f){ state.session = null; return; }
    if(s.done) return;
    var keep = [], ni = 0;
    s.ids.forEach(function(id,idx){
      if(f.cards.some(function(c){return c.id===id;})){ keep.push(id); if(idx<s.i) ni++; }
    });
    s.ids = keep; s.i = ni;
    if(!keep.length) state.session = null;
    else if(s.i>=keep.length) s.done = true;
  }
};

var root = $('#app'), mroot = $('#modal-root');

  go: function(v){
    view = v; App.render(); window.scrollTo(0,0);

  },
  render: function(){
    if((view.name==='folder'||view.name==='setup') && !Model.folder(view.id)) view = {name:'home'};

      if(!state.session) view = {name:'home'};
      else if(state.session.done) view = {name:'review'};
    }
    if(view.name==='review' && !state.session) view = {name:'home'};
    root.innerHTML = '<div class="wrap">'+Views[view.name]()+'</div>';
    if(view.name==='test')  Test.mount();
    if(view.name==='setup') Setup.mount();

};

   7. SETUP: Prüfung einrichten
   ===================================================================== */
var Setup = {
  updateCount: function(){
    var f = Model.folder(view.id); if(!f) return;
    var max = Model.pool(f,state.prefs.pool).length, c = Model.effCount(max);
    var r = $('#cnt'); if(r) r.value = Math.max(1,c);
    var o = $('#cnt-out'); if(o) o.textContent = c;
    var b = $('#start-btn'); if(b && max) b.textContent = 'Prüfung mit '+plural(c,'Frage','Fragen')+' starten';
  },
  mount: function(){
    var r = $('#cnt'); if(!r) return;
    r.addEventListener('input', function(){ state.prefs.count = +r.value; Setup.updateCount(); Store.saveSoon(); });
  }
};

/* =====================================================================
   8. TEST: Karte umdrehen, bewerten, Sitzung starten
   ===================================================================== */
var Test = {
  grow: function(ta){
    ta.style.height = 'auto';
    ta.style.height = Math.max(LH*4, Math.ceil(ta.scrollHeight/LH)*LH)+'px';
  },
  setOwnView: function(){
    var ov = $('#own-view'); if(!ov) return;
    var t = (state.session.draft||'').trim();
    ov.textContent = t || 'Nichts eingegeben';
    ov.className = t ? '' : 'empty';
  },
  mount: function(){
    var s = state.session, ta = $('#own');
    ta.value = s.draft||''; Test.grow(ta); Test.setOwnView();
    ta.addEventListener('input', function(){ s.draft = ta.value; Test.grow(ta); Store.saveSoon(); });
    ta.addEventListener('keydown', function(e){ if((e.metaKey||e.ctrlKey) && e.key==='Enter'){ e.preventDefault(); Test.flip(); } });
    if(!s.flipped){ try{ ta.focus({preventScroll:true}); }catch(e){} }
  },
  flip: function(){
    var s = state.session; if(!s || view.name!=='test') return;
    var ta = $('#own'); if(ta) s.draft = ta.value;
    s.flipped = !s.flipped;
    $('#flip').classList.toggle('is-flipped', s.flipped);
    var fr = $('.front'), bk = $('.back');
    fr.toggleAttribute('inert', s.flipped); bk.toggleAttribute('inert', !s.flipped);
    fr.setAttribute('aria-hidden', s.flipped?'true':'false'); bk.setAttribute('aria-hidden', s.flipped?'false':'true');
    $('#flipbtn').textContent = s.flipped ? 'Zurückdrehen' : 'Umdrehen';
    $$('.rate-btn').forEach(function(b){ b.disabled = !s.flipped; });
    $('#rate-hint').textContent = s.flipped ? '' : 'Erst umdrehen, dann bewerten.';
    Test.setOwnView();
    if(s.flipped){ if(ta) ta.blur(); } else if(ta){ try{ ta.focus({preventScroll:true}); }catch(e){} }
    Store.save();
  },
  rate: function(k){
    var s = state.session; if(!s || !s.flipped) return;
    var id = s.ids[s.i], f = Model.folder(s.folderId), c = f && f.cards.find(function(x){return x.id===id;});
    var ta = $('#own'); if(ta) s.draft = ta.value;
    if(c){
      var dir = s.dirs[id] || 'de-en', sd = Model.side(c,dir);
      s.res[id] = {s:k, own:(s.draft||'').trim(), q:sd.q, a:sd.a, lbl:Model.isDeen(f)?DIR_SHORT[dir]:''};
      c.s = k;
    }
    s.i++; s.flipped = false; s.draft = '';
    if(s.i>=s.ids.length){ s.done = true; Store.save(); App.go({name:'review'}); return; }
    Store.save(); App.go({name:'test'});
  },
  start: function(f,ids,dirs){
    state.session = {folderId:f.id, folderName:f.name, ids:ids, dirs:dirs, i:0, res:{}, flipped:false, draft:'', done:false};
    Store.save(); App.go({name:'test'});
  }
};

/* =====================================================================
   9. MODALS: Dialoge

var modalCtx = null, lastFocus = null;

var Modals = {
  open: function(html,focusSel){
    lastFocus = document.activeElement;
    mroot.innerHTML = '<div class="overlay" data-m="overlay"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="m-title">'+html+'</div></div>';

  head: function(title){

  /* --- Neuer Ordner (mit Typ-Auswahl) --- */
  folder: function(){

      +'<p class="label">Art der Karteikarten</p>'

      +'<p class="err" id="m-err" role="alert"></p>'
      +'<div class="sheet-actions"><button class="btn primary" data-m="save-folder">Ordner anlegen</button></div>', '#m-name');
  },
  setType: function(t){
    modalCtx.ftype = t;
    $$('[data-m="type"]',mroot).forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.t===t ? 'true' : 'false'); });
  },
  saveFolder: function(){
    var name = $('#m-name').value.trim(), err = $('#m-err');
    if(!name){ err.textContent = 'Bitte gib einen Namen ein.'; return; }
    if(state.folders.some(function(f){return f.name.toLowerCase()===name.toLowerCase();})){ err.textContent = 'Diesen Ordner gibt es schon.'; return; }
    var f = {id:uid(), name:name, type:modalCtx.ftype, cards:[]};

  /* --- Karte anlegen / bearbeiten (Beschriftung je nach Ordnertyp) --- */
  card: function(cardId){
    var f = Model.folder(view.id), c = cardId ? f.cards.find(function(x){return x.id===cardId;}) : null, deen = Model.isDeen(f);
    modalCtx = {type:'card', cardId:cardId||null};
    Modals.open(Modals.head(c ? 'Karte bearbeiten' : 'Neue Karte')
      +'<label class="field"><span>'+(deen?'Deutsch':'Frage')+'</span><textarea id="m-q" rows="'+(deen?2:3)+'" placeholder="'+(deen?'z. B. der Hund':'Was möchtest du wissen?')+'"></textarea></label>'
      +'<label class="field"><span>'+(deen?'Englisch':'Lösung')+'</span><textarea id="m-a" rows="'+(deen?2:4)+'" placeholder="'+(deen?'z. B. the dog':'Die richtige Antwort')+'" autocapitalize="none"></textarea></label>'
      +'<p class="err" id="m-err" role="alert"></p>'

    if(c){ $('#m-q').value = c.q; $('#m-a').value = c.a; }
  },
  saveCard: function(next){
    var q = $('#m-q').value.trim(), a = $('#m-a').value.trim(), err = $('#m-err'), f = Model.folder(view.id);
    if(!q || !a){
      err.textContent = Model.isDeen(f) ? 'Bitte gib das deutsche und das englische Wort ein.' : 'Bitte gib Frage und Lösung ein.';
      (q ? $('#m-a') : $('#m-q')).focus(); return;

    if(modalCtx && modalCtx.cardId){
      var c = f.cards.find(function(x){return x.id===modalCtx.cardId;}); if(c){ c.q = q; c.a = a; }

        $('#m-q').value = ''; $('#m-a').value = ''; err.textContent = ''; $('#m-q').focus();

    }

  },

  /* --- Bestätigung --- */
  confirm: function(title,text,yesLabel,onYes){
    modalCtx = {type:'confirm', onYes:onYes};
    Modals.open(Modals.head(title)+'<p>'+esc(text)+'</p><div class="sheet-actions"><button class="btn ghost" data-m="close">Abbrechen</button><button class="btn danger" data-m="yes">'+esc(yesLabel)+'</button></div>');
  },

  /* --- Sicherung --- */
  backup: function(){
    modalCtx = {type:'backup', armed:false};
    Modals.open(Modals.head('Sicherung und Übertragung')
      +'<p>Deine Karten liegen nur in diesem Browser. Kopiere den Text, um sie zu sichern oder auf ein anderes Gerät zu bringen.</p>'
      +'<textarea id="m-export" rows="4" readonly aria-label="Sicherungstext"></textarea>'
      +'<div class="sheet-actions" style="margin-top:10px"><button class="btn" data-m="copy">Text kopieren</button></div>'
      +'<hr><p>Sicherungstext einfügen. Das ersetzt alle Ordner auf diesem Gerät.</p>'
      +'<textarea id="m-import" rows="3" placeholder="Sicherungstext hier einfügen" aria-label="Sicherungstext einfügen"></textarea>'
      +'<p class="err" id="m-err" role="alert" style="margin-top:8px"></p>'
      +'<div class="sheet-actions"><button class="btn ghost" id="m-import-btn" data-m="import">Wiederherstellen</button></div>', '#m-export');
    $('#m-export').value = JSON.stringify({app:'kartei', version:1, folders:state.folders, prefs:state.prefs});
  },
  copyText: function(){
    var ta = $('#m-export'); ta.focus(); ta.select(); try{ ta.setSelectionRange(0,ta.value.length); }catch(e){}
    var done = function(ok){ toast(ok ? 'Text kopiert' : 'Text ist markiert, bitte selbst kopieren'); };
    var legacy = function(){ var ok=false; try{ ok = document.execCommand('copy'); }catch(e){} done(ok); };
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(function(){done(true);}, legacy);
    else legacy();
  },
  importBackup: function(){
    var btn = $('#m-import-btn'), err = $('#m-err'), txt = $('#m-import').value.trim();
    if(!txt){ err.textContent = 'Bitte füge zuerst den Sicherungstext ein.'; return; }
    var d; try{ d = JSON.parse(txt); if(!d || !Array.isArray(d.folders)) throw new Error('x'); }catch(e){ err.textContent = 'Der Text ist keine gültige Sicherung.'; return; }
    if(!modalCtx.armed){ modalCtx.armed = true; btn.textContent = 'Ja, alles ersetzen'; btn.className = 'btn danger'; err.textContent = ''; return; }
    var n = Store.normalize({folders:d.folders, prefs:d.prefs});
    state.folders = n.folders; state.prefs = n.prefs; state.session = null;
    Store.save(); Modals.close(); App.go({name:'home'}); toast('Sicherung wiederhergestellt');
  }
};

/* =====================================================================
   10. ACTIONS: Klick-Handler (data-a="…")
   ===================================================================== */
var Actions = {
  'home':         function(){ App.go({name:'home'}); },
  'open-folder':  function(el){ App.go({name:'folder', id:el.dataset.id}); },
  'back-folder':  function(){ App.go({name:'folder', id:view.id}); },
  'new-folder':   function(){ Modals.folder(); },
  'backup':       function(){ Modals.backup(); },
  'del-folder': function(el){
    var f = Model.folder(el.dataset.id); if(!f) return;
    Modals.confirm('Ordner löschen?', '„'+f.name+'“ und '+plural(f.cards.length,'Karte','Karten')+' werden gelöscht. Das lässt sich nicht rückgängig machen.', 'Ordner löschen', function(){
      state.folders = state.folders.filter(function(x){return x.id!==f.id;});
      if(state.session && state.session.folderId===f.id) state.session = null;
      Store.save(); App.render(); toast('Ordner gelöscht');
    });
  },
  'new-card':  function(){ Modals.card(null); },
  'edit-card': function(el){ Modals.card(el.dataset.id); },
  'del-card': function(el){
    var f = Model.folder(view.id), c = f && f.cards.find(function(x){return x.id===el.dataset.id;}); if(!c) return;
    Modals.confirm('Karte löschen?', 'Die Karte „'+(c.q.length>80 ? c.q.slice(0,80)+'…' : c.q)+'“ wird gelöscht.', 'Karte löschen', function(){
      f.cards = f.cards.filter(function(x){return x.id!==c.id;});
      Model.sanitizeSession(); Store.save(); App.render(); toast('Karte gelöscht');
    });
  },
  'reset-status': function(){
    var f = Model.folder(view.id); if(!f) return;
    Modals.confirm('Status zurücksetzen?', 'Alle Karten in „'+f.name+'“ gelten danach wieder als nicht geprüft.', 'Zurücksetzen', function(){
      f.cards.forEach(function(c){c.s = null;}); Store.save(); App.render(); toast('Status zurückgesetzt');
    });
  },
  'setup': function(){
    var f = Model.folder(view.id); if(!f || !f.cards.length) return;
    if(!Model.pool(f,state.prefs.pool).length) state.prefs.pool = 'all';
    App.go({name:'setup', id:f.id});
  },
  'pool': function(el){ state.prefs.pool = el.dataset.p; Store.save(); App.render(); },
  'dir':  function(el){ state.prefs.dir = el.dataset.d; Store.save(); App.render(); },
  'step': function(el){
    var f = Model.folder(view.id), max = Model.pool(f,state.prefs.pool).length, cur = Model.effCount(max);
    state.prefs.count = Math.max(1, Math.min(max, cur+(+el.dataset.d))); Setup.updateCount(); Store.saveSoon();
  },
  'all-count': function(){
    var f = Model.folder(view.id); state.prefs.count = Model.pool(f,state.prefs.pool).length; Setup.updateCount(); Store.saveSoon();
  },
  'start': function(){
    var f = Model.folder(view.id), p = state.prefs, list = Model.pool(f,p.pool); if(!list.length) return;
    var n = Model.effCount(list.length), ids = list.map(function(c){return c.id;});
    if(p.shuffle) ids = Model.shuffled(ids);
    ids = ids.slice(0,n);
    Test.start(f, ids, Model.pickDirs(f,ids,p.dir));
  },
  'flip': function(){ Test.flip(); },
  'rate': function(el){ Test.rate(el.dataset.s); },
  'pause': function(){ var s = state.session; Store.save(); App.go({name:'folder', id:s.folderId}); },
  'resume-session': function(){
    Model.sanitizeSession(); var s = state.session;
    if(!s){ Store.save(); App.go({name:'home'}); return; }
    App.go({name:s.done ? 'review' : 'test'});
  },
  'view-result':     function(){ App.go({name:'review'}); },
  'discard-session': function(){ state.session = null; Store.save(); App.render(); },
  'to-folder': function(){
    var s = state.session;
    if(s && Model.folder(s.folderId)) App.go({name:'folder', id:s.folderId}); else App.go({name:'home'});
  },
  'retest': function(el){
    var s = state.session, f = Model.folder(s.folderId); if(!f){ App.go({name:'home'}); return; }
    var k = el.dataset.f;
    var ids = s.ids.filter(function(id){
      var r = s.res[id]; if(!r) return false;
      if(!f.cards.some(function(c){return c.id===id;})) return false;
      if(k==='alle') return true;
      if(k==='schwach') return r.s==='mittel' || r.s==='falsch';
      return r.s===k;
    });
    if(!ids.length) return;
    var dirs = {}; ids.forEach(function(id){ dirs[id] = s.dirs[id] || 'de-en'; });   // gleiche Richtung wie zuvor
    if(state.prefs.shuffle) ids = Model.shuffled(ids);
    Test.start(f, ids, dirs);
  }
};

/* =====================================================================
   11. EVENTS
   ===================================================================== */
document.addEventListener('click', function(e){
  var el = e.target.closest('[data-a]'); if(!el || el.disabled) return;
  var fn = Actions[el.dataset.a]; if(fn) fn(el,e);
});
document.addEventListener('change', function(e){
  if(e.target && e.target.id==='shuf'){ state.prefs.shuffle = e.target.checked; Store.save(); }
});
mroot.addEventListener('click', function(e){
  var el = e.target.closest('[data-m]'); if(!el) return;
  var m = el.dataset.m;
  if(m==='overlay'){ if(e.target===el) Modals.close(); return; }
  if(m==='close') Modals.close();
  else if(m==='type') Modals.setType(el.dataset.t);
  else if(m==='save-folder') Modals.saveFolder();
  else if(m==='save-card') Modals.saveCard(false);
  else if(m==='save-card-next') Modals.saveCard(true);
  else if(m==='yes'){ var fn = modalCtx && modalCtx.onYes; Modals.close(); if(fn) fn(); }
  else if(m==='copy') Modals.copyText();
  else if(m==='import') Modals.importBackup();
});
mroot.addEventListener('keydown', function(e){
  if(e.key==='Enter' && e.target.id==='m-name'){ e.preventDefault(); Modals.saveFolder(); }
  if(e.key==='Enter' && (e.metaKey||e.ctrlKey) && (e.target.id==='m-q'||e.target.id==='m-a')){ e.preventDefault(); Modals.saveCard(!(modalCtx && modalCtx.cardId)); }
});
document.addEventListener('keydown', function(e){
  if(e.key==='Escape' && mroot.firstChild){ Modals.close(); return; }
  if(view.name==='test' && state.session && state.session.flipped && !mroot.firstChild && !/^(TEXTAREA|INPUT)$/.test(e.target.tagName)){
    var k = {'1':'richtig','2':'mittel','3':'falsch'}[e.key]; if(k) Test.rate(k);
  }
});
window.addEventListener('resize', function(){ var t = $('#own'); if(t) Test.grow(t); });

/* =====================================================================
   12. START
   ===================================================================== */
App.render();
})();
</script>
</body>
</html>
